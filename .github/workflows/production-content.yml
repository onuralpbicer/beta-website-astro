name: Production content

on:
  repository_dispatch:
    types: [sanity-production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debounce:
    name: Wait for published content to settle
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'repository_dispatch' ||
       (github.event.client_payload.projectId == '12mm2gbu' &&
        github.event.client_payload.dataset == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: production-content-debounce
      cancel-in-progress: true
    steps:
      - name: Debounce Sanity publications
        if: github.event_name == 'repository_dispatch'
        run: sleep 60
      - name: Ready
        run: echo 'Published content rebuild requested.'

  rebuild:
    name: Rebuild deployed production code
    needs: debounce
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    # Hold the same lock as tag uploads while resolving, rebuilding and uploading.
    # A content rebuild can never upload old code over a concurrent tagged release.
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
      queue: max
    env:
      SANITY_PREVIEW_TOKEN: ''
    steps:
      - name: Resolve currently deployed production commit
        id: production
        uses: actions/github-script@v9
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          script: |
            if (!process.env.CLOUDFLARE_API_TOKEN) {
              throw new Error('Set CLOUDFLARE_API_TOKEN in the GitHub production environment.');
            }
            const response = await fetch(
              'https://api.cloudflare.com/client/v4/accounts/dba4a4829a48119d0a35590a29f11b91/pages/projects/beta-website',
              { headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } }
            );
            if (!response.ok) throw new Error(`Cloudflare project lookup failed: ${response.status}`);
            const body = await response.json();
            const deployment = body.result?.canonical_deployment;
            const commit = deployment?.deployment_trigger?.metadata?.commit_hash;
            if (!body.success || deployment?.environment !== 'production' ||
                deployment?.latest_stage?.status !== 'success' || !/^[a-f0-9]{40}$/.test(commit || '')) {
              throw new Error('Production must have a successful deployment with a full Git commit SHA.');
            }
            const version = deployment.deployment_trigger.metadata.commit_message;
            if (!/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(version || '')) {
              throw new Error('Production has no release version metadata. Deploy a version tag with the updated CI workflow first.');
            }
            core.setOutput('commit', commit);
            core.setOutput('version', version);
            core.info(`Rebuilding production ${version} at commit ${commit}`);

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.production.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify deployed code is on trunk
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The deployed production commit must be reachable from main."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Support deployed commits before pnpm was pinned
        id: tooling
        run: |
          node -e "const fs = require('node:fs'); const version = require('./package.json').packageManager ? '' : '10.33.0'; fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + version + '\n');"

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.tooling.outputs.version }}

      - name: Install deployed code dependencies
        run: pnpm install --frozen-lockfile

      - name: Build fresh published content
        env:
          SITE_VERSION: ${{ steps.production.outputs.version }}
          SITE_BUILD_NUMBER: ${{ github.run_id }}.${{ github.run_attempt }}
        run: pnpm build

      - name: Deploy refreshed production site
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: dba4a4829a48119d0a35590a29f11b91
          packageManager: pnpm
          wranglerVersion: '4'
          command: pages deploy dist --project-name=beta-website --branch=production --commit-hash=${{ steps.production.outputs.commit }} --commit-message=${{ steps.production.outputs.version }}
