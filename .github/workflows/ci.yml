name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Production and CI must only build published Sanity content.
      SANITY_PREVIEW_TOKEN: ''
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH (for example, v1.2.3)."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tags must point to a commit on main."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build published site
        env:
          SITE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'ci' }}
          SITE_BUILD_NUMBER: ${{ github.run_id }}.${{ github.run_attempt }}
        run: pnpm build

      - name: Upload release site
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: release-site
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          overwrite: true

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-site
          path: dist/

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN in the GitHub production environment."
            exit 1
          fi

      - name: Deploy release artifact to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: dba4a4829a48119d0a35590a29f11b91
          packageManager: npm
          wranglerVersion: '4'
          # This is the existing Pages production label, not a Git branch to maintain.
          command: pages deploy dist --project-name=beta-website --branch=production --commit-hash=${{ github.sha }} --commit-message=${{ github.ref_name }}
